document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c07879d4-c113-412c-99f4-76238d8baaad\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fc32d562-d819-4ce4-ad66-2c817308f47b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n  <script src=\"43057418-a516-46ec-b53e-a1c04b678eb9\"><\u002Fscript>\n  <title>Genética · Cuadros de Punnett<\u002Ftitle>\n  \n  <style>\n    :root:root {\n      --color-bg: #ffffff; --color-surface: #eef3f5; --color-text: #14212b;\n      --color-accent: #138a83; --color-accent-2: #1f3d7a;\n      --color-divider: color-mix(in srgb, #14212b 16%, transparent);\n      --color-neutral-100: #f1f4f6; --color-neutral-200: #e0e6ea; --color-neutral-300: #c7d0d6; --color-neutral-400: #a3afb8; --color-neutral-500: #7d8b95; --color-neutral-600: #5f6d77; --color-neutral-700: #45525c; --color-neutral-800: #2f3b44; --color-neutral-900: #1c252c;\n      --color-accent-100: #e6f6f5; --color-accent-200: #c4ebe8; --color-accent-300: #93d8d3; --color-accent-400: #55bdb6; --color-accent-500: #1f9e97; --color-accent-600: #16827c; --color-accent-700: #106762; --color-accent-800: #0b4d49; --color-accent-900: #063431;\n      --color-accent-2-100: #e8eef9; --color-accent-2-200: #cddbf2; --color-accent-2-300: #a6bfe6; --color-accent-2-400: #7598d3; --color-accent-2-500: #4a72bb; --color-accent-2-600: #2f569e; --color-accent-2-700: #213f7e; --color-accent-2-800: #172d5d; --color-accent-2-900: #0f1d3e;\n      --color-coral-100: #fff0ec; --color-coral-200: #ffd9cf; --color-coral-300: #ffb5a3; --color-coral-400: #f88a72; --color-coral-500: #e8664c; --color-coral-600: #c94d35; --color-coral-700: #a03a26; --color-coral-800: #742a1b; --color-coral-900: #4a1b11;\n      --shadow-sm: 0 1px 2px color-mix(in srgb, #1c252c 12%, transparent);\n      --shadow-md: 0 3px 10px color-mix(in srgb, #1c252c 14%, transparent);\n      --shadow-lg: 0 12px 32px color-mix(in srgb, #1c252c 20%, transparent);\n    }\n    html { scroll-behavior: smooth; }\n    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }\n    a { color: var(--color-accent-700); }\n    a:hover { color: var(--color-accent-800); }\n    button { font-family: inherit; }\n    button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--color-bg);overflow-x:hidden\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:0 24px\">\n    <nav class=\"nav\" style=\"padding-inline:0;flex-wrap:wrap\">\n      <span class=\"nav-brand\" style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em\">Genética · Unidad 7<\u002Fspan><span style=\"font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--color-accent-700)\">Curso Ciencias de la Vida<\u002Fspan><span style=\"font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--color-accent-700)\">Sección 30<\u002Fspan><\u002Fspan>\n      <a href=\"#repaso\">Repaso<\u002Fa>\n      <a href=\"#laboratorio\">Laboratorio<\u002Fa>\n      <a href=\"#practica\">Práctica<\u002Fa>\n      <a href=\"#prueba\">Prueba<\u002Fa>\n    <\u002Fnav>\n\n    <header style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:48px;align-items:center;padding:56px 0 72px\">\n      <div style=\"display:flex;flex-direction:column;gap:20px;align-items:flex-start\">\n        <span class=\"tag tag-accent-2\">Biología · Genética mendeliana<\u002Fspan>\n        <h1 style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.02em;font-size:clamp(44px,6vw,72px);line-height:1;margin:0;text-wrap:balance\">Cuadros de Punnett, paso a paso<\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.55;margin:0;max-width:34em;text-wrap:pretty\">Repasa los conceptos clave, construye cruces en el laboratorio, resuelve problemas guiados y pon a prueba lo que aprendiste en la Unidad 7.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n          <a class=\"btn btn-primary\" href=\"#laboratorio\" style=\"font-family:'Archivo',sans-serif;font-weight:700;padding:12px 22px;font-size:15px\">Abrir el laboratorio<\u002Fa>\n          <a class=\"btn btn-secondary\" href=\"#prueba\" style=\"font-family:'Archivo',sans-serif;font-weight:700;padding:12px 22px;font-size:15px;color:var(--color-text)\">Tomar la prueba<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;justify-self:start;padding:28px\">\n        <div style=\"position:absolute;width:280px;height:280px;border-radius:50%;background:var(--color-accent-2-200);top:-20px;right:-40px\"><\u002Fdiv>\n        <div style=\"position:absolute;width:120px;height:120px;border-radius:50%;background:var(--color-accent-200);bottom:-10px;left:-10px\"><\u002Fdiv>\n        <div style=\"position:relative;background:var(--color-surface);border-radius:32px;padding:22px;box-shadow:var(--shadow-md);display:grid;grid-template-columns:48px 96px 96px;gap:10px;align-items:center;justify-items:center\">\n          <div style=\"font-size:13px;font-weight:700;color:var(--color-accent-700)\">Pp×Pp<\u002Fdiv>\n          <div style=\"width:44px;height:44px;border-radius:50%;background:var(--color-accent-2-200);display:grid;place-items:center;font-weight:700;font-size:20px\">P<\u002Fdiv>\n          <div style=\"width:44px;height:44px;border-radius:50%;background:var(--color-accent-2-200);display:grid;place-items:center;font-weight:700;font-size:20px\">p<\u002Fdiv>\n          <div style=\"width:44px;height:44px;border-radius:50%;background:var(--color-accent-2-200);display:grid;place-items:center;font-weight:700;font-size:20px\">P<\u002Fdiv>\n          <div style=\"width:96px;height:84px;border-radius:20px;background:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px\"><span style=\"font-weight:700;font-size:24px\">PP<\u002Fspan><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent-700)\"><\u002Fspan><\u002Fdiv>\n          <div style=\"width:96px;height:84px;border-radius:20px;background:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px\"><span style=\"font-weight:700;font-size:24px\">Pp<\u002Fspan><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent-700)\"><\u002Fspan><\u002Fdiv>\n          <div style=\"width:44px;height:44px;border-radius:50%;background:var(--color-accent-2-200);display:grid;place-items:center;font-weight:700;font-size:20px\">p<\u002Fdiv>\n          <div style=\"width:96px;height:84px;border-radius:20px;background:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px\"><span style=\"font-weight:700;font-size:24px\">Pp<\u002Fspan><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-accent-700)\"><\u002Fspan><\u002Fdiv>\n          <div style=\"width:96px;height:84px;border-radius:20px;background:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px\"><span style=\"font-weight:700;font-size:24px\">pp<\u002Fspan><span style=\"width:14px;height:14px;border-radius:50%;background:var(--color-neutral-100);border:1px solid var(--color-divider)\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <section id=\"repaso\" data-screen-label=\"Repaso\" style=\"padding:24px 0 80px;display:flex;flex-direction:column;gap:32px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">01 · Repaso<\u002Fspan>\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:clamp(32px,4vw,44px);margin:0;line-height:1.1\">El vocabulario que necesitas<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px\">\n        <div class=\"card\" style=\"padding:22px\"><span class=\"card-title\" style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:20px\">Gen<\u002Fspan><p class=\"card-body\" style=\"font-size:15px;line-height:1.5;opacity:.9\">Unidad hereditaria de información en el ADN, ubicada en una posición específica (locus) de un cromosoma.<\u002Fp><\u002Fdiv>\n        <div class=\"card\" style=\"padding:22px\"><span class=\"card-title\" style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:20px\">Alelos<\u002Fspan><p class=\"card-body\" style=\"font-size:15px;line-height:1.5;opacity:.9\">Variantes o alternativas de un gen. Cada individuo hereda un alelo de cada progenitor.<\u002Fp><\u002Fdiv>\n        <div class=\"card\" style=\"padding:22px\"><span class=\"card-title\" style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:20px\">Genotipo<\u002Fspan><p class=\"card-body\" style=\"font-size:15px;line-height:1.5;opacity:.9\">Combinación de alelos para un locus. Se escribe con símbolos: <b>PP<\u002Fb>, <b>Pp<\u002Fb>, <b>pp<\u002Fb>.<\u002Fp><\u002Fdiv>\n        <div class=\"card\" style=\"padding:22px\"><span class=\"card-title\" style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:20px\">Fenotipo<\u002Fspan><p class=\"card-body\" style=\"font-size:15px;line-height:1.5;opacity:.9\">Manifestación física distinguible de la información genética: color, forma, grupo sanguíneo…<\u002Fp><\u002Fdiv>\n        <div class=\"card\" style=\"padding:22px\"><span class=\"card-title\" style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:20px\">Homocigoto<\u002Fspan><p class=\"card-body\" style=\"font-size:15px;line-height:1.5;opacity:.9\">Dos alelos iguales. Dominante (<b>PP<\u002Fb>) o recesivo (<b>pp<\u002Fb>).<\u002Fp><\u002Fdiv>\n        <div class=\"card\" style=\"padding:22px\"><span class=\"card-title\" style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:20px\">Heterocigoto<\u002Fspan><p class=\"card-body\" style=\"font-size:15px;line-height:1.5;opacity:.9\">Dos alelos distintos (<b>Pp<\u002Fb>). Con dominancia completa, se expresa el dominante.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-accent-2-100);border-radius:32px;padding:32px;display:flex;flex-direction:column;gap:22px\">\n        <h3 style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:26px;margin:0;color:var(--color-accent-2-900)\">Cómo resolver un cuadro de Punnett<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px\">\n          <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"flex:none;width:40px;height:40px;border-radius:50%;background:var(--color-accent-2-600);color:var(--color-bg);display:grid;place-items:center;font-weight:800\">1<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.5;color:var(--color-accent-2-900)\"><b>Identifica los genotipos<\u002Fb> de ambos progenitores a partir del enunciado.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"flex:none;width:40px;height:40px;border-radius:50%;background:var(--color-accent-2-600);color:var(--color-bg);display:grid;place-items:center;font-weight:800\">2<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.5;color:var(--color-accent-2-900)\"><b>Separa los alelos en gametos<\u002Fb>: cada gameto recibe un solo alelo (principio de segregación).<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"flex:none;width:40px;height:40px;border-radius:50%;background:var(--color-accent-2-600);color:var(--color-bg);display:grid;place-items:center;font-weight:800\">3<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.5;color:var(--color-accent-2-900)\"><b>Combina los gametos<\u002Fb>: cada casilla une el alelo de su fila con el de su columna.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;align-items:flex-start\"><span style=\"flex:none;width:40px;height:40px;border-radius:50%;background:var(--color-accent-2-600);color:var(--color-bg);display:grid;place-items:center;font-weight:800\">4<\u002Fspan><p style=\"margin:0;font-size:15px;line-height:1.5;color:var(--color-accent-2-900)\"><b>Cuenta las casillas<\u002Fb>: cada una vale 1/4 (25 %) de probabilidad.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"laboratorio\" data-screen-label=\"Laboratorio\" style=\"padding:24px 0 80px;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">02 · Laboratorio<\u002Fspan>\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:clamp(32px,4vw,44px);margin:0;line-height:1.1\">Construye tu propio cruce<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.5;max-width:40em\">Elige el tipo de herencia y los genotipos de los progenitores. El cuadro y las proporciones se calculan al instante.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ labModes }}\" as=\"m\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"border:1.5px solid {{ m.bd }};background:{{ m.bg }};color:{{ m.fg }};border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer\">{{ m.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;align-items:start\">\n        <div style=\"background:var(--color-surface);border-radius:32px;padding:28px;display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:22px\">{{ labTrait }}<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ labLegend }}\" as=\"l\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;gap:10px;align-items:baseline;font-size:15px\"><b style=\"min-width:28px;font-size:17px\">{{ l.al.b }}<sup style=\"font-size:.6em\">{{ l.al.s }}<\u002Fsup><\u002Fb><span>{{ l.text }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase\">{{ labN1 }}<\u002Fspan>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <sc-for list=\"{{ labOpts1 }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"min-width:64px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};border-radius:999px;padding:10px 16px;font-size:18px;font-weight:700;cursor:pointer;display:flex;justify-content:center\"><sc-for list=\"{{ o.al }}\" as=\"a\"><span>{{ a.b }}<sup style=\"font-size:.6em\">{{ a.s }}<\u002Fsup><\u002Fspan><\u002Fsc-for><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase\">{{ labN2 }}<\u002Fspan>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <sc-for list=\"{{ labOpts2 }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"min-width:64px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};border-radius:999px;padding:10px 16px;font-size:18px;font-weight:700;cursor:pointer;display:flex;justify-content:center\"><sc-for list=\"{{ o.al }}\" as=\"a\"><span>{{ a.b }}<sup style=\"font-size:.6em\">{{ a.s }}<\u002Fsup><\u002Fspan><\u002Fsc-for><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-bg);border-radius:22px;padding:18px 20px;font-size:15px;line-height:1.55\"><b style=\"color:var(--color-accent-700)\">Recuerda: <\ n        <span style=\"font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">04 · Prueba<\u002Fspan>\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:clamp(32px,4vw,44px);margin:0;line-height:1.1\">¿Cuánto sabes de la Unidad 7?<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.5;max-width:40em\">Preguntas basadas en la presentación de clase: herencia, cromosomas, postulados de Mendel, excepciones y herencia ligada al sexo.<\u002Fp>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ quizActive }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:780px;background:var(--color-surface);border-radius:36px;padding:32px;display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;justify-content:space-between;font-size:14px;font-weight:600\"><span>Pregunta {{ qNum }} de {{ qTotal }}<\u002Fspan><span style=\"color:var(--color-accent-2-700)\">Aciertos: {{ qCorrectSoFar }}<\u002Fspan><\u002Fdiv>\n            <div style=\"height:10px;border-radius:999px;background:var(--color-bg);overflow:hidden\"><div style=\"height:100%;border-radius:999px;background:var(--color-accent-2-500);width:{{ qProgress }};transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.01em;font-size:26px;line-height:1.25;margin:0;text-wrap:pretty\">{{ qText }}<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ qOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;align-items:center;gap:14px;text-align:left;border:2px solid {{ o.bd }};background:{{ o.bg }};color:var(--color-text);border-radius:24px;padding:12px 18px 12px 12px;font-size:16px;line-height:1.4;cursor:pointer\">\n                <span style=\"flex:none;width:34px;height:34px;border-radius:50%;background:{{ o.lbg }};color:{{ o.lfg }};display:grid;place-items:center;font-weight:800;font-size:14px\">{{ o.letter }}<\u002Fspan>\n                <span style=\"flex:1\">{{ o.t }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ qShowFb }}\">\n            <div style=\"border-radius:22px;padding:16px 18px;font-size:15px;line-height:1.55;background:{{ qFbBg }};color:{{ qFbFg }}\"><b>{{ qFbTitle }}<\u002Fb> {{ qExp }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;justify-content:flex-end\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ qNext }}\" disabled=\"{{ qNextDisabled }}\" style=\"font-family:'Archivo',sans-serif;font-weight:700;padding:12px 24px;font-size:15px\">{{ qNextLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ quizDone }}\">\n        <div style=\"display:flex;flex-direction:column;gap:24px;max-width:860px\">\n          <div style=\"background:var(--color-accent-2-100);border-radius:36px;padding:32px;display:flex;gap:28px;align-items:center;flex-wrap:wrap\">\n            <div style=\"flex:none;width:140px;height:140px;border-radius:50%;background:var(--color-accent-2-600);color:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center\"><span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:44px;line-height:1\">{{ qScore }}<\u002Fspan><span style=\"font-size:14px;font-weight:600\">de {{ qTotal }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;flex:1;min-width:220px\">\n              <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:30px;color:var(--color-accent-2-900)\">{{ qScoreMsg }}<\u002Fspan>\n              <p style=\"margin:0;font-size:16px;line-height:1.5;color:var(--color-accent-2-900)\">Obtuviste {{ qScorePct }}. Revisa abajo las respuestas y las explicaciones.<\u002Fp>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ restartQuiz }}\" style=\"font-family:'Archivo',sans-serif;font-weight:700;padding:12px 22px;font-size:15px;align-self:flex-start\">Repetir la prueba<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ qReview }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface);border-radius:26px;padding:20px 22px;display:flex;flex-direction:column;gap:8px\">\n                <div style=\"display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap\"><b style=\"font-size:16px;line-height:1.4;flex:1;min-width:200px\">{{ r.n }}. {{ r.q }}<\u002Fb><span style=\"font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:{{ r.tagBg }};color:{{ r.tagFg }}\">{{ r.tag }}<\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:15px\">Tu respuesta: {{ r.yours }}<\u002Fspan>\n                <sc-if value=\"{{ r.wrong }}\"><span style=\"font-size:15px;color:var(--color-accent-800);font-weight:600\">Respuesta correcta: {{ r.correct }}<\u002Fspan><\u002Fsc-if>\n                <span style=\"font-size:14px;line-height:1.5;opacity:.85\">{{ r.exp }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <footer style=\"padding:32px 0 48px;font-size:14px;opacity:.75;text-align:center\">© Gabriela Palomo-Munoz, 2026<\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;preguntas&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:12,&quot;min&quot;:5,&quot;max&quot;:18,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Prueba&quot;},&quot;mezclar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prueba&quot;},&quot;retroInmediata&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prueba&quot;}}\">\nconst AL = {\n  P:{b:'P',s:''}, p:{b:'p',s:''}, R:{b:'R',s:''}, B:{b:'B',s:''}, N:{b:'N',s:''},\n  IA:{b:'I',s:'A'}, IB:{b:'I',s:'B'}, i:{b:'i',s:''},\n  XH:{b:'X',s:'H'}, Xh:{b:'X',s:'h'}, Y:{b:'Y',s:''}\n};\nconst NEUT = 'var(--color-neutral-100)';\nconst MODES = {\n  completa: {\n    label:'Dominancia completa', trait:'Color de la flor en arvejas',\n    ctx:'En las arvejas, el color púrpura de la flor (P) es dominante sobre el blanco (p).',\n    legend:[['P','púrpura (dominante)'],['p','blanca (recesivo)']], order:['P','p'],\n    g1:[['P','P'],['P','p'],['p','p']], g2:[['P','P'],['P','p'],['p','p']], n1:'Progenitor 1', n2:'Progenitor 2',\n    ph:g => g.includes('P') ? 'Púrpura' : 'Blanca',\n    tones:{'Púrpura':'var(--color-accent-700)','Blanca':NEUT},\n    desc:{PP:'una planta púrpura homocigota', Pp:'una planta púrpura heterocigota', pp:'una planta de flores blancas'},\n    note:'basta un alelo dominante (P) para que se exprese el fenotipo dominante. Solo el homocigoto recesivo (pp) muestra el fenotipo recesivo.'\n  },\n  incompleta: {\n    label:'Dominancia incompleta', trait:'Color de la flor en la boca de dragón',\n    ctx:'En la boca de dragón, el color de la flor presenta dominancia incompleta: R = roja, B = blanca, y el heterocigoto es rosado.',\n    legend:[['R','roja'],['B','blanca']], order:['R','B'],\n    g1:[['R','R'],['R','B'],['B','B']], g2:[['R','R'],['R','B'],['B','B']], n1:'Progenitor 1', n2:'Progenitor 2',\n    ph:g => ({RR:'Roja',RB:'Rosada',BB:'Blanca'})[g.join('')],\n    tones:{'Roja':'var(--color-coral-600)','Rosada':'var(--color-coral-300)','Blanca':NEUT},\n    desc:{RR:'una planta de flores rojas', RB:'una planta de flores rosadas', BB:'una planta de flores blancas'},\n    note:'ningún alelo domina: el heterocigoto tiene un fenotipo intermedio. Las proporciones fenotípicas son iguales a las genotípicas.'\n  },\n  codominancia: {\n    label:'Codominancia', trait:'Color del pelaje en el ganado',\n    ctx:'En cierto ganado, el color del pelaje es codominante: N = negro, B = blanco, y el heterocigoto tiene manchas negras y blancas.',\n    legend:[['N','pelaje negro'],['B','pelaje blanco']], order:['N','B'],\n    g1:[['N','N'],['N','B'],['B','B']], g2:[['N','N'],['N','B'],['B','B']], n1:'Progenitor 1', n2:'Progenitor 2',\n    ph:g => ({NN:'Negro',NB:'Manchado',BB:'Blanco'})[g.join('')],\n    tones:{'Negro':'var(--color-neutral-800)','Manchado':'linear-gradient(135deg, var(--color-neutral-800) 50%, var(--color-neutral-100) 50%)','Blanco':NEUT},\n    desc:{NN:'un animal de pelaje negro', NB:'un animal de pelaje manchado', BB:'un animal de pelaje blanco'},\n    note:'ambos alelos se expresan con la misma intensidad: el heterocigoto muestra manchas de los dos colores, no un color intermedio.'\n  },\n  abo: {\n    label:'Alelos múltiples (ABO)', trait:'Grupos sanguíneos ABO',\n    ctx:'El grupo sanguíneo ABO se determina por alelos múltiples: Iᴬ e Iᴮ son codominantes entre sí y ambos dominan sobre i.',\n    legend:[['IA','antígeno A'],['IB','antígeno B'],['i','sin antígeno (recesivo)']], order:['IA','IB','i'],\n    g1:[['IA','IA'],['IA','i'],['IB','IB'],['IB','i'],['IA','IB'],['i','i']],\n    g2:[['IA','IA'],['IA','i'],['IB','IB'],['IB','i'],['IA','IB'],['i','i']], n1:'Progenitor 1', n2:'Progenitor 2',\n    ph:g => g.includes('IA') && g.includes('IB') ? 'Tipo AB' : g.includes('IA') ? 'Tipo A' : g.includes('IB') ? 'Tipo B' : 'Tipo O',\n    tones:{'Tipo A':'var(--color-accent-500)','Tipo B':'var(--color-accent-2-500)','Tipo AB':'linear-gradient(135deg, var(--color-accent-500) 50%, var(--color-accent-2-500) 50%)','Tipo O':'var(--color-neutral-300)'},\n    desc:{IAIA:'una persona tipo A homocigota', IAi:'una persona tipo A heterocigota', IBIB:'una persona tipo B homocigota', IBi:'una persona tipo B heterocigota', IAIB:'una persona tipo AB', ii:'una persona tipo O'},\n    note:'hay más de dos alelos para un mismo locus. Iᴬ e Iᴮ son codominantes (tipo AB) y ambos dominan sobre i (tipo O = ii).'\n  },\n  x: {\n    label:'Ligada al cromosoma X', trait:'Hemofilia (recesiva ligada al X)',\n    ctx:'La hemofilia es un desorden recesivo ligado al cromosoma X: Xᴴ = normal, Xʰ = hemofilia.',\n    legend:[['XH','alelo normal'],['Xh','hemofilia (recesivo)'],['Y','cromosoma Y (no lleva el gen)']], order:['XH','Xh','Y'],\n    g1:[['XH','XH'],['XH','Xh'],['Xh','Xh']], g2:[['XH','Y'],['Xh','Y']], n1:'Madre (XX)', n2:'Padre (XY)',\n    ph:g => g.includes('Y') ? (g.includes('Xh') ? 'Hombre con hemofilia' : 'Hombre sin hemofilia')\n      : ['Mujer sin hemofilia','Mujer portadora','Mujer con hemofilia'][g.filter(a => a === 'Xh').length],\n    tones:{'Mujer sin hemofilia':'var(--color-accent-2-300)','Mujer portadora':'var(--color-accent-2-600)','Mujer con hemofilia':'var(--color-coral-600)','Hombre sin hemofilia':'var(--color-accent-2-300)','Hombre con hemofilia':'var(--color-coral-600)'},\n    desc:{XHXH:'una mujer que no porta el alelo de la hemofilia', XHXh:'una mujer portadora', XhXh:'una mujer con hemofilia', XHY:'un hombre sin hemofilia', XhY:'un hombre con hemofilia'},\n    note:'los hombres (XY) tienen una sola copia del X y siempre la reciben de su madre; no tienen una segunda copia que compense un alelo defectuoso.'\n  }\n};\nconst MODE_IDS = ['completa','incompleta','codominancia','abo','x'];\n\nconst Q = [\n  {q:'¿Qué estudia la genética?', o:['La herencia: la transmisión del ADN de padres a hijos','El funcionamiento de los órganos del cuerpo','La clasificación de los seres vivos','La evolución del clima'], e:'La genética es el estudio de la herencia, es decir, la transmisión de ADN de una generación a otra.'},\n  {q:'En los eucariotas, ¿cómo se organiza el ADN?', o:['En cromosomas, que están compuestos por genes','En ribosomas, que contienen proteínas','En mitocondrias, que contienen todos los genes','Libre en el citoplasma, sin organización'], e:'En eucariotas el ADN se organiza en cromosomas, y los cromosomas están compuestos por genes.'},\n  {q:'¿Cuántos pares de cromosomas tenemos los humanos?', o:['23 pares','46 pares','22 pares','12 pares'], e:'Los humanos tenemos 23 pares de cromosomas (46 en total); cada progenitor aporta un cromosoma de cada par.'},\n  {q:'¿Dónde se encuentran los cromosomas en una célula eucariota?', o:['En el núcleo','En la membrana celular','En los ribosomas','En la pared celular'], e:'El cromosoma es ADN empaquetado que se encuentra en el núcleo de la célula.'},\n  {q:'¿Qué es un gen?', o:['Una unidad hereditaria de información en el ADN, ubicada en un locus específico','Un par de cromosomas homólogos','La manifestación física de un rasgo','Un tipo de célula sexual'], e:'Un gen es una unidad hereditaria de información en el ADN, ubicada en una posición específica (locus) de un cromosoma.'},\n  {q:'Las variantes o alternativas de un mismo gen se llaman…', o:['Alelos','Fenotipos','Loci','Gametos'], e:'Los alelos son variantes de un gen; el genotipo es la combinación de alelos para un locus.'},\n  {q:'¿Con qué organismo trabajó Mendel alrededor de 1860?', o:['Arvejas (guisantes)','Moscas de la fruta','Ratones','Bacterias'], e:'Mendel evaluó la transmisión de caracteres usando arvejas como modelo. No conocía el ADN, la mitosis ni los cromosomas.'},\n  {q:'El fenotipo se define como…', o:['La manifestación física distinguible de la información genética','La combinación de alelos de un individuo','La posición de un gen en el cromosoma','El número de cromosomas de una especie'], e:'El fenotipo es lo que se observa; el genotipo es la combinación de alelos que lo produce.'},\n  {q:'Un individuo con genotipo Aa es…', o:['Heterocigoto','Homocigoto dominante','Homocigoto recesivo','Haploide'], e:'Tiene dos alelos distintos para el mismo gen, por eso es heterocigoto.'},\n  {q:'¿Qué establece el principio de segregación de Mendel?', o:['Los alelos se separan en los gametos y cada gameto recibe un solo alelo','Un alelo siempre domina sobre el otro','Los rasgos se mezclan como pinturas','Los gametos reciben ambos alelos de cada gen'], e:'En la meiosis (anafase) los alelos se separan; cada gameto es haploide y lleva un solo alelo.'},\n  {q:'Según el principio de dominancia, en un heterocigoto…', o:['Un alelo (dominante) se expresa sobre el otro (recesivo)','Ambos alelos se expresan por igual','Ningún alelo se expresa','Se expresa un fenotipo intermedio'], e:'Uno de los alelos del par domina sobre el otro: el dominante se expresa y el recesivo queda oculto.'},\n  {q:'Al cruzar una flor roja con una blanca, toda la descendencia es rosada. ¿Qué tipo de herencia es?', o:['Dominancia incompleta','Codominancia','Dominancia completa','Herencia ligada al X'], e:'En la dominancia incompleta ningún alelo domina y el heterocigoto muestra un fenotipo intermedio.'},\n  {q:'Un animal heterocigoto muestra manchas de ambos colores con la misma intensidad. Esto es…', o:['Codominancia','Dominancia incompleta','Alelos múltiples','Epigenética'], e:'En la codominancia se manifiestan los dos productos de los alelos, no un intermedio.'},\n  {q:'En la dominancia incompleta, las proporciones fenotípicas…', o:['Son iguales a las genotípicas','Siempre son 3 : 1','Siempre son 9 : 3 : 3 : 1','No se pueden calcular'], e:'Como cada genotipo produce un fenotipo distinto, las proporciones fenotípicas coinciden con las genotípicas (1 : 2 : 1).'},\n  {q:'Los grupos sanguíneos ABO son un ejemplo de…', o:['Alelos múltiples','Herencia ligada al Y','Dominancia incompleta','Epigenética'], e:'Hay más de dos alelos (Iᴬ, Iᴮ, i) para un mismo locus, lo que produce más de dos fenotipos posibles.'},\n  {q:'¿Cuál de estos es un desorden recesivo ligado al cromosoma X?', o:['Hemofilia','Grupo sanguíneo O','Pelaje manchado','Flor rosada'], e:'La hemofilia, el daltonismo y la distrofia muscular son desórdenes recesivos ligados al X.'},\n  {q:'¿Por qué los hombres se ven más afectados por los desórdenes recesivos ligados al X?', o:['Tienen un solo cromosoma X, sin una segunda copia que compense','Tienen dos cromosomas X','El cromosoma Y contiene el alelo defectuoso','Heredan el X de su padre'], e:'Los hombres (46XY) tienen una sola copia del X; si es defectuosa, no hay otra que cancele su efecto.'},\n  {q:'Un hijo varón hereda su cromosoma X de…', o:['Su madre','Su padre','Ambos padres','Ninguno: lo genera él mismo'], e:'Del padre recibe el cromosoma Y; el X siempre proviene de la madre.'}\n];\n\nconst shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst rnd = n => Math.floor(Math.random() * n);\nconst sortG = (m, g) => g.slice().sort((a, b) => m.order.indexOf(a) - m.order.indexOf(b));\nconst keyOf = g => g.join('');\nconst view = g => g.map(id => AL[id]);\nconst allGenos = m => { const seen = {}, out = []; m.g1.concat(m.g2).forEach(g => { const k = keyOf(g); if (!seen[k]) { seen[k] = 1; out.push(g); } }); return out; };\nconst cross = (m, a, b) => b.map(y => a.map(x => sortG(m, [x, y])));\nconst pctStr = c => (c * 25) + '%';\nconst C = {\n  sel:{bg:'var(--color-accent)', fg:'var(--color-bg)', bd:'var(--color-accent)'},\n  off:{bg:'var(--color-bg)', fg:'var(--color-text)', bd:'var(--color-divider)'},\n  ok:{bg:'var(--color-accent-200)', fg:'var(--color-accent-900)', bd:'var(--color-accent-600)'},\n  bad:{bg:'var(--color-coral-100)', fg:'var(--color-coral-900)', bd:'var(--color-coral-600)'}\n};\nconst MSG = {\n  ok:{bg:'var(--color-accent-200)', fg:'var(--color-accent-900)'},\n  bad:{bg:'var(--color-coral-100)', fg:'var(--color-coral-900)'}\n};\n\nfunction stats(m, flat) {\n  const gc = {}, pc = {};\n  flat.forEach(g => { const k = keyOf(g); gc[k] = (gc[k] || 0) + 1; const p = m.ph(g); pc[p] = (pc[p] || 0) + 1; });\n  const geno = allGenos(m).filter(g => gc[keyOf(g)]).map(g => ({al:view(g), count:gc[keyOf(g)], frac:gc[keyOf(g)] + '/4', pct:pctStr(gc[keyOf(g)])}));\n  const pheno = Object.keys(m.tones).filter(p => pc[p]).map(p => ({label:p, tone:m.tones[p], count:pc[p], frac:pc[p] + '/4', pct:pctStr(pc[p])}));\n  return {geno, pheno, gRatio:geno.map(g => g.count).join(' : '), pRatio:pheno.map(p => p.count).join(' : '), pc};\n}\n\nfunction makeProblem() {\n  const mode = MODE_IDS[rnd(MODE_IDS.length)], m = MODES[mode];\n  const i1 = rnd(m.g1.length), i2 = rnd(m.g2.length);\n  const flat = cross(m, m.g1[i1], m.g2[i2]).flat();\n  const present = [...new Set(flat.map(g => m.ph(g)))];\n  const all = Object.keys(m.tones);\n  const target = Math.random() < 0.8 ? present[rnd(present.length)] : all[rnd(all.length)];\n  const count = flat.filter(g => m.ph(g) === target).length;\n  return {mode, i1, i2, target, count};\n}\nconst freshPr = () => ({step:1, s1:null, s2:null, c1:false, cells:[null,null,null,null], active:0, c2:false, ans:null, tries:0, revealed:false});\n\nfunction makeQuiz(n, mix) {\n  const idx = mix ? shuffle(Q.map((_, i) => i)) : Q.map((_, i) => i);\n  return {items: idx.slice(0, Math.min(n, Q.length)).map(i => ({i, opts: shuffle(Q[i].o.map((t, k) => ({t, ok:k === 0})))})), idx:0, picks:[], done:false};\n}\n\nclass Component extends DCLogic {\n  state = {labMode:'completa', l1:1, l2:1, prob:makeProblem(), pr:freshPr(), quiz:null, solved:0};\n\n  componentDidMount() { this.setState({quiz: makeQuiz(this.nQ(), this.props.mezclar ?? true)}); }\n  nQ() { return this.props.preguntas ?? 12; }\n  setPr(p) { this.setState(s => ({pr:{...s.pr, ...p}})); }\n\n  renderVals() {\n    const S = this.state;\n    // Laboratorio\n    const lm = MODES[S.labMode];\n    const l1 = Math.min(S.l1, lm.g1.length - 1), l2 = Math.min(S.l2, lm.g2.length - 1);\n    const lg1 = lm.g1[l1], lg2 = lm.g2[l2];\n    const lrows = cross(lm, lg1, lg2);\n    const lst = stats(lm, lrows.flat());\n    const opts = (list, cur, key) => list.map((g, i) => ({al:view(g), ...(i === cur ? C.sel : C.off), onClick:() => this.setState({[key]:i})}));\n\n    // Práctica\n    const P = S.prob, pm = MODES[P.mode], pr = S.pr;\n    const pg1 = pm.g1[P.i1], pg2 = pm.g2[P.i2];\n    const prows = cross(pm, pg1, pg2), pflat = prows.flat();\n    const step1Done = pr.step > 1;\n    const pOpt = (list, chosen, correct, key) => list.map((g, i) => {\n      let st = C.off;\n      if (step1Done) st = i === correct ? C.ok : C.off;\n      else if (pr.c1 && i === chosen) st = i === correct ? C.ok : C.bad;\n      else if (i === chosen) st = C.sel;\n      return {al:view(g), ...st, onClick:() => { if (!step1Done) this.setPr({[key]:i, c1:false}); }};\n    });\n    let s1Msg = '', s1M = MSG.ok;\n    if (step1Done) s1Msg = pr.revealed1 ? 'Estos son los genotipos correctos. Fíjate en las pistas del enunciado.' : '¡Correcto! Ahora separa los alelos en gametos.';\n    else if (pr.c1) {\n      if (pr.s1 === null || pr.s2 === null) { s1Msg = 'Elige un genotipo para cada progenitor.'; s1M = MSG.bad; }\n      else { s1Msg = 'Revisa ' + [pr.s1 !== P.i1 ? 'el primer progenitor' : '', pr.s2 !== P.i2 ? 'el segundo progenitor' : ''].filter(Boolean).join(' y ') + '. Pista: relee el fenotipo y si es homocigoto o heterocigoto.'; s1M = MSG.bad; }\n    }\n    const step2Done = pr.step > 2;\n    const palette = allGenos(pm);\n    const pRows = prows.map((row, ri) => ({\n      side:{al:[AL[pg2[ri]]]},\n      cells: row.map((g, ci) => {\n        const idx = ri * 2 + ci, val = pr.cells[idx];\n        const vg = val ? palette.find(x => keyOf(x) === val) : null;\n        let bg = 'var(--color-bg)', bd = 'var(--color-divider)', bstyle = val ? 'solid' : 'dashed';\n        if (pr.c2 || step2Done) { if (val === keyOf(g)) { bg = C.ok.bg; bd = C.ok.bd; } else { bg = C.bad.bg; bd = C.bad.bd; } }\n        if (!step2Done && pr.active === idx) { bd = 'var(--color-accent)'; bstyle = 'solid'; }\n        return {al:vg ? view(vg) : [], empty:vg ? '' : '?', bg, bd, bstyle, onClick:() => { if (!step2Done) this.setPr({active:idx}); }};\n      })\n    }));\n    const fill = k => {\n      if (step2Done) return;\n      const cells = pr.cells.slice(); cells[pr.active] = k;\n      let next = cells.findIndex((c, i) => c === null && i > pr.active);\n      if (next < 0) next = cells.findIndex(c => c === null);\n      this.setPr({cells, active:next < 0 ? pr.active : next, c2:false});\n    };\n    const wrongCells = pflat.filter((g, i) => pr.cells[i] !== keyOf(g)).length;\n    let s2Msg = '', s2M = MSG.ok;\n    if (step2Done) s2Msg = pr.revealed2 ? 'Así queda el cuadro: cada casilla une el gameto de su fila con el de su columna.' : '¡Cuadro correcto! Cada casilla representa 1/4 de la descendencia.';\n    else if (pr.c2) { s2Msg = pr.cells.includes(null) ? 'Completa las cuatro casillas.' : `${wrongCells} casilla${wrongCells > 1 ? 's' : ''} por corregir. Une el alelo de la fila con el de la columna.`; s2M = MSG.bad; }\n\n    const answers = [0, 25, 50, 75, 100];\n    const correctPct = P.count * 25;\n    const s3Done = pr.ans === correctPct;\n    const pAnswers = answers.map(v => {\n      let st = C.off;\n      if (pr.ans === v) st = v === correctPct ? C.ok : C.bad;\n      return {label:v + '%', ...st, onClick:() => {\n        if (s3Done || pr.step < 3) return;\n        const ok = v === correctPct;\n        this.setState(s => ({pr:{...s.pr, ans:v, tries:s.pr.tries + 1}, solved:s.solved + (ok && s.pr.tries === 0 ? 1 : 0)}));\n      }};\n    });\n    let s3Msg = '', s3M = MSG.ok;\n    if (pr.ans !== null) {\n      const why = `${P.count} de 4 casillas tienen el fenotipo «${P.target}» → ${P.count}/4 = ${correctPct}%.`;\n      if (s3Done) s3Msg = (pr.tries === 1 ? '¡Excelente! ' : '¡Correcto! ') + why;\n      else { s3Msg = 'No es correcto. Cuenta cuántas casillas muestran ese fenotipo; cada una vale 25 %.'; s3M = MSG.bad; }\n    }\n\n    // Prueba\n    const qz = S.quiz;\n    const instant = this.props.retroInmediata ?? true;\n    let qv = {quizActive:false, quizDone:false, qOpts:[], qReview:[]};\n    if (qz) {\n      const total = qz.items.length;\n      const scoreOf = qz.picks.filter((p, i) => p != null && qz.items[i].opts[p].ok).length;\n      if (!qz.done) {\n        const it = qz.items[qz.idx], base = Q[it.i], pick = qz.picks[qz.idx], answered = pick != null;\n        const reveal = answered && instant;\n        const okPick = answered && it.opts[pick].ok;\n        qv = {\n          quizActive:true, quizDone:false, qNum:qz.idx + 1, qTotal:total,\n          qProgress:((qz.idx + (answered ? 1 : 0)) / total * 100) + '%',\n          qCorrectSoFar: instant ? scoreOf : '—',\n          qText:base.q,\n          qOpts: it.opts.map((o, k) => {\n            let bd = 'transparent', bg = 'var(--color-bg)', lbg = 'var(--color-surface)', lfg = 'var(--color-text)';\n            if (reveal && o.ok) { bd = C.ok.bd; bg = C.ok.bg; lbg = 'var(--color-accent-600)'; lfg = 'var(--color-bg)'; }\n            else if (reveal && k === pick) { bd = C.bad.bd; bg = C.bad.bg; lbg = 'var(--color-coral-600)'; lfg = 'var(--color-bg)'; }\n            else if (!reveal && k === pick) { bd = 'var(--color-accent)'; lbg = 'var(--color-accent)'; lfg = 'var(--color-bg)'; }\n            return {t:o.t, letter:'ABCD'[k], bd, bg, lbg, lfg, onClick:() => {\n              if (instant && answered) return;\n              const picks = qz.picks.slice(); picks[qz.idx] = k;\n              this.setState({quiz:{...qz, picks}});\n            }};\n          }),\n          qShowFb:reveal, qFbTitle:okPick ? '¡Correcto!' : 'Incorrecto.', qExp:base.e,\n          qFbBg:okPick ? MSG.ok.bg : MSG.bad.bg, qFbFg:okPick ? MSG.ok.fg : MSG.bad.fg,\n          qNextDisabled:!answered, qNextLabel:qz.idx === total - 1 ? 'Ver resultados' : 'Siguiente',\n          qNext:() => { if (!answered) return; this.setState({quiz: qz.idx === total - 1 ? {...qz, done:true} : {...qz, idx:qz.idx + 1}}); },\n          qReview:[]\n        };\n      } else {\n        const pct = Math.round(scoreOf / total * 100);\n        qv = {\n          quizActive:false, quizDone:true, qTotal:total, qScore:scoreOf, qScorePct:pct + '%',\n          qScoreMsg: pct >= 90 ? '¡Excelente trabajo!' : pct >= 70 ? '¡Muy bien!' : pct >= 50 ? 'Vas por buen camino' : 'Repasa y vuelve a intentarlo',\n          qOpts:[],\n          qReview: qz.items.map((it, i) => {\n            const p = qz.picks[i], ok = it.opts[p].ok;\n            return {n:i + 1, q:Q[it.i].q, yours:it.opts[p].t, correct:Q[it.i].o[0], exp:Q[it.i].e, wrong:!ok,\n              tag:ok ? 'Correcta' : 'Incorrecta', tagBg:ok ? C.ok.bg : C.bad.bg, tagFg:ok ? C.ok.fg : C.bad.fg};\n          })\n        };\n      }\n    }\n\n    return {\n      labModes: MODE_IDS.map(id => ({label:MODES[id].label, ...(id === S.labMode ? C.sel : C.off), onClick:() => this.setState({labMode:id, l1:Math.min(S.l1, MODES[id].g1.length - 1), l2:Math.min(S.l2, MODES[id].g2.length - 1)})})),\n      labTrait:lm.trait, labLegend:lm.legend.map(([id, text]) => ({al:AL[id], text})),\n      labN1:lm.n1, labN2:lm.n2, labNote:lm.note,\n      labOpts1:opts(lm.g1, l1, 'l1'), labOpts2:opts(lm.g2, l2, 'l2'),\n      labCross: S.labMode === 'x' ? '♀ / ♂' : 'P1 / P2',\n      labTop: lg1.map(a => ({al:[AL[a]]})),\n      labRows: lrows.map((row, ri) => ({side:{al:[AL[lg2[ri]]]}, cells:row.map(g => { const p = lm.ph(g); return {al:view(g), pheno:p, tone:lm.tones[p]}; })})),\n      labGeno:lst.geno, labPheno:lst.pheno, labGenoRatio:lst.gRatio, labPhenoRatio:lst.pRatio,\n\n      solved:S.solved,\n      newProblem:() => this.setState({prob:makeProblem(), pr:freshPr()}),\n      pModeLabel:pm.label,\n      pStatement:`${pm.ctx} Se cruza ${pm.desc[keyOf(pg1)]} con ${pm.desc[keyOf(pg2)]}.`,\n      pN1:pm.n1, pN2:pm.n2,\n      pOpts1:pOpt(pm.g1, pr.s1, P.i1, 's1'), pOpts2:pOpt(pm.g2, pr.s2, P.i2, 's2'),\n      s1Msg, s1MsgBg:s1M.bg, s1MsgFg:s1M.fg, s1Open:!step1Done,\n      check1:() => this.setPr(pr.s1 === P.i1 && pr.s2 === P.i2 ? {c1:true, step:2} : {c1:true}),\n      reveal1:() => this.setPr({s1:P.i1, s2:P.i2, c1:true, step:2, revealed1:true}),\n      s2Opacity:pr.step >= 2 ? 1 : 0.45, s2Events:pr.step >= 2 ? 'auto' : 'none',\n      pTop:pg1.map(a => ({al:[AL[a]]})), pRows,\n      pPalette: step2Done ? [] : palette.map(g => ({al:view(g), onClick:() => fill(keyOf(g))})),\n      s2Msg, s2MsgBg:s2M.bg, s2MsgFg:s2M.fg, s2Open:pr.step === 2,\n      check2:() => this.setPr(wrongCells === 0 ? {c2:true, step:3} : {c2:true}),\n      reveal2:() => this.setPr({cells:pflat.map(keyOf), c2:true, step:3, revealed2:true}),\n      s3Opacity:pr.step >= 3 ? 1 : 0.45, s3Events:pr.step >= 3 ? 'auto' : 'none',\n      pQuestion:`¿Qué porcentaje de la descendencia se espera con el fenotipo «${P.target}»?`,\n      pAnswers, s3Msg, s3MsgBg:s3M.bg, s3MsgFg:s3M.fg, s3Done,\n\n      ...qv,\n      restartQuiz:() => this.setState({quiz:makeQuiz(this.nQ(), this.props.mezclar ?? true)})\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
